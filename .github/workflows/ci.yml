name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  contract:
    name: Contract — stub suite, GenVM Direct Mode, lint, mutation matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-genvm-v0.2.16
      - run: pip install -r requirements-test.txt
      - name: Deterministic suite
        run: python -m unittest discover -s tests -v
      - name: GenVM Direct Mode suite
        run: python -m pytest tests/direct -q -p no:cacheprovider
      - name: genvm-linter (offline AST checks)
        run: python -m genvm_linter.cli lint contracts/market.py
      - name: Mutation matrix (both suites)
        run: python tests/mutation_check.py
