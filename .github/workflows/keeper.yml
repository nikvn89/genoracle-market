name: GenOracle Keeper Bot

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  keeper-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Keeper Bot
        run: node scripts/keeper.js
        env:
          CONTRACT_ADDRESS: '0x3C9B69F85E2CD0c980343aA02CA5754eD57c3F51'
          RPC_URL: 'https://studio.genlayer.com/api'
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY || '0x72bf6e67319555b11f47754b6eba01ce6d67fa377ce6c62437bb8677d346fd28' }}
